    const container = document.getElementById('timeline');
    function renderTimeline() {
      const lang = (window.CryptoLabI18n && window.CryptoLabI18n.lang) || 'fr';
      container.innerHTML = '';
      EVENTS.forEach((ev) => {
        const sideLeft = ev.side === 'left';
        const item = document.createElement('div');
        item.className = `relative flex ${sideLeft ? 'md:flex-row' : 'md:flex-row-reverse'} flex-row items-start gap-6 reveal visible`;
        item.innerHTML = `
          <div class="absolute left-4 md:left-1/2 -translate-x-1/2 w-4 h-4 rounded-full ${ev.available ? 'bg-brand-500 ring-4 ring-brand-500/20' : 'bg-slate-600 ring-4 ring-slate-600/20'} mt-6"></div>
          <div class="hidden md:block w-1/2"></div>
          <div class="ml-12 md:ml-0 w-full md:w-1/2 ${sideLeft ? 'md:pr-12' : 'md:pl-12'}">
            <a href="${ev.available ? ev.href : '#'}" class="block group">
              <div class="p-6 bg-white/5 border border-white/10 rounded-xl transition hover:border-brand-500/40 hover:bg-white/10 lift ${!ev.available ? 'opacity-60' : ''}">
                <div class="flex items-center gap-3 mb-3">
                  <span class="text-2xl">${ev.icon}</span>
                  <div>
                    <div class="text-xs font-mono text-brand-500">${ev.year[lang]}</div>
                    <h3 class="font-bold text-lg group-hover:text-brand-500 transition">${ev.title[lang]}</h3>
                  </div>
                </div>
                <div class="inline-block px-2 py-0.5 text-xs rounded bg-white/5 border border-white/10 text-slate-300 mb-3">${ev.type[lang]}</div>
                <p class="text-sm text-slate-400">${ev.desc[lang]}</p>
                <div class="mt-4 text-xs ${ev.available ? 'text-brand-500' : 'text-slate-500'}">
                  ${ev.available ? (lang==='en'?'→ Explore':'→ Explorer') : (lang==='en'?'🔒 Coming soon':'🔒 Bientôt disponible')}
                </div>
              </div>
            </a>
          </div>
        `;
        container.appendChild(item);
      });
    }
    renderTimeline();
    document.addEventListener('lang-changed', renderTimeline);
  </script>
</body>
</html>
