<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3aa0ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#0b0f17"/>
  <!-- Rune triangle ⟁ with inner detail -->
  <g filter="url(#glow)" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M32 12 L52 48 L12 48 Z"/>
    <path d="M32 24 L42 42 L22 42 Z" stroke-width="2" opacity="0.7"/>
    <circle cx="32" cy="36" r="2.5" fill="url(#g)" stroke="none"/>
  </g>
</svg>
